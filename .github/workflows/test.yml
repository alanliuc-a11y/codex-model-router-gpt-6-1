name: Router package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  updater:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build-manifests.py
      - run: git diff --exit-code -- version.json profiles/20-usd/version.json
